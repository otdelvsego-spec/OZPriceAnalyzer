name: Windows application

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/initial-python-app
      - agent/report-total-labels-v0.5.16
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        shell: pwsh
        run: |
          python scripts/generate_version_info.py
          pyinstaller --noconfirm --clean OZPriceAnalyzer.spec
          Copy-Item README_WINDOWS.txt "dist/OZPriceAnalyzer/Прочтите_перед_запуском.txt"

      - name: Smoke-test built executable
        shell: pwsh
        run: ./scripts/smoke_test_windows.ps1 -ExecutablePath "dist/OZPriceAnalyzer/OZPriceAnalyzer.exe"

      - name: Sign executable when certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/sign_windows.ps1 -ExecutablePath "dist/OZPriceAnalyzer/OZPriceAnalyzer.exe"

      - name: Prepare artifact metadata
        id: package
        shell: pwsh
        run: |
          $version = python -c "from ozon_app import __version__; print(__version__)"
          "artifact_name=OZPriceAnalyzer-Windows-x64-v$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/OZPriceAnalyzer
          if-no-files-found: error
          retention-days: 30
